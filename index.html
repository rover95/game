<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>游戏导航</title>
  <link rel="stylesheet" href="./site/style.css">
</head>
<body>
  <main class="hub">
    <header class="hero">
      <p class="eyebrow">Game Hub</p>
      <h1>游戏导航</h1>
      <p class="summary">
        这里会逐步收纳这个项目下的所有小游戏。当前已接入 2 个游戏，点击卡片即可进入。
      </p>
    </header>

    <section class="game-grid" aria-label="游戏列表">
      <article class="game-card">
        <div class="game-card__meta">
          <p class="game-card__tag">Matter.js / Sling / Destruction</p>
          <h2>Siege Shot</h2>
          <p>
            类似愤怒的小鸟的投射拆楼游戏，包含超重慢速球、超快轻质球和碰撞爆炸球，并提供多个建筑预设。
          </p>
        </div>
        <a class="game-card__link" href="./games/siege/">进入游戏</a>
      </article>

      <article class="game-card">
        <div class="game-card__meta">
          <p class="game-card__tag">3D / Physics / Merge</p>
          <h2>Impact Merge 2048</h2>
          <p>
            带堆叠、震动、合并音效和移动端滑动操作的 3D 2048。
          </p>
        </div>
        <a class="game-card__link" href="./games/2048/">进入游戏</a>
      </article>
    </section>
  </main>
</body>
</html>
