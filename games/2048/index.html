<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Impact Merge 2048</title>
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.183.2/build/three.module.js",
        "three/": "https://unpkg.com/three@0.183.2/",
        "cannon-es": "https://esm.sh/cannon-es@0.20.0"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <aside class="hud">
      <p class="eyebrow">Three.js + Physics + Liquid Merge</p>
      <h1>Impact Merge 2048</h1>
      <p class="summary">
        固定俯视角的真实 3D 2048。桌面端可用方向键或 WASD，移动端可直接滑动游玩。
      </p>

      <div class="stats">
        <section class="stat-card">
          <span>Score</span>
          <strong id="score">0</strong>
        </section>
        <section class="stat-card">
          <span>Best</span>
          <strong id="best">0</strong>
        </section>
      </div>

      <div class="actions">
        <button id="restart" type="button">重新开始</button>
        <label class="board-size-picker">
          <span>棋盘</span>
          <select id="board-size">
            <option value="4">4 x 4</option>
            <option value="5">5 x 5</option>
            <option value="6">6 x 6</option>
          </select>
        </label>
        <p>控制方式: 方向键 / WASD / 滑动</p>
      </div>

      <section class="debug-tools">
        <div class="debug-tools__header">
          <strong>调试模式</strong>
          <button id="debug-toggle" class="debug-toggle" type="button">开启</button>
        </div>
        <div id="debug-panel" class="debug-panel hidden">
          <p>载入预设后按一次左方向键，直接体验大数字合并震动。</p>
          <div class="debug-panel__actions">
            <button type="button" data-debug-preset="128">128 合并</button>
            <button type="button" data-debug-preset="512">512 合并</button>
            <button type="button" data-debug-preset="1024">1024 合并</button>
          </div>
        </div>
      </section>
    </aside>

    <main class="viewport-shell">
      <div id="viewport" class="viewport" aria-label="3D 2048 board"></div>

      <section id="overlay" class="overlay hidden">
        <div class="overlay-card">
          <p id="overlay-tag" class="overlay-tag"></p>
          <h2 id="overlay-title"></h2>
          <p id="overlay-body"></p>
          <div class="overlay-actions">
            <button id="continue" type="button">继续游戏</button>
            <button id="overlay-restart" type="button">再来一局</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="./app3d.js"></script>
</body>
</html>
