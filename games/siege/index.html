<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Siege Shot</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app">
    <aside class="hud">
      <p class="eyebrow">Matter.js / Defense / Intercept</p>
      <h1>Siege Shot</h1>
      <p class="summary">
        左下是发射区，右下是生成区。生成物会以随机抛射角冲向左侧，你需要用三种弹体把它们在落地前全部拦下。
      </p>

      <section class="stats" aria-label="游戏统计">
        <article class="stat-card">
          <span>Score</span>
          <strong id="score">0</strong>
        </article>
        <article class="stat-card">
          <span>Missed</span>
          <strong id="targets">0</strong>
        </article>
        <article class="stat-card">
          <span>Active</span>
          <strong id="blocks">0</strong>
        </article>
        <article class="stat-card">
          <span>Cleared</span>
          <strong id="shots">0</strong>
        </article>
      </section>

      <section class="panel">
        <div class="panel__head">
          <h2>发射类型</h2>
          <span id="spawn-rate" class="pill">2.40s</span>
        </div>
        <div class="ammo-grid">
          <button type="button" class="ammo-card" data-projectile-type="heavy">
            <span class="ammo-card__label">超重慢速球</span>
            <span class="ammo-card__meta">一击碎三级球 / 不破损 / 1 秒冷却</span>
            <strong id="ammo-heavy">READY</strong>
          </button>
          <button type="button" class="ammo-card" data-projectile-type="swift">
            <span class="ammo-card__label">超快轻质球</span>
            <span class="ammo-card__meta">一次碰撞即破损 / 三级球需命中 3 次</span>
            <strong id="ammo-swift">READY</strong>
          </button>
          <button type="button" class="ammo-card" data-projectile-type="blast">
            <span class="ammo-card__label">碰撞爆炸球</span>
            <span class="ammo-card__meta">碰撞即爆炸 / 范围摧毁任意生成球 / 3 秒冷却</span>
            <strong id="ammo-blast">READY</strong>
          </button>
        </div>
      </section>

      <section class="panel">
        <div class="panel__head">
          <h2>节奏</h2>
          <span id="ammo-total" class="pill">Ramp Up</span>
        </div>
        <p id="spawn-status" class="hint">
          右下生成区会持续把 1 到 3 级生成球抛向左侧区域，时间越久，生成频率越高。
        </p>
      </section>

      <section class="panel panel--compact">
        <div class="actions">
          <button id="restart" type="button">重新开始</button>
        </div>
        <p class="hint">
          操作: 点击画布任意位置都可发射，超出左下发射区会按最大力度发射。键盘可用 <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> 切球，<kbd>R</kbd> 重开。
        </p>
      </section>
    </aside>

    <main class="stage-shell">
      <canvas id="stage" class="stage" aria-label="物理拦截游戏画布"></canvas>
    </main>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
